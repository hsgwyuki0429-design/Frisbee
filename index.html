<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3fa9ff" />
    <meta name="description" content="カラフルな島々をめぐる3Dディスクゴルフ。角度・傾き・スワイプでディスクを投げて、バスケットを狙え！" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:title" content="DISC ISLAND ディスクアイランド" />
    <meta property="og:description" content="角度・傾き・スワイプで投げる！カラフルな3Dディスクゴルフゲーム" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet" />
    <title>DISC ISLAND ディスクアイランド</title>
    <style>
      html, body { margin: 0; height: 100%; background: #3fa9ff; overflow: hidden; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: linear-gradient(#3fa9ff, #bfeaff); z-index: 100; transition: opacity .5s; font-family: "Fredoka", "M PLUS Rounded 1c", sans-serif; color: #fff; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .spin { width: 72px; height: 72px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #fff 0 22%, #ff4f5e 23% 100%);
        border: 5px solid #2a2140; box-shadow: 0 6px 0 #2a2140; animation: bootspin 1s linear infinite; }
      #boot b { font-size: 22px; letter-spacing: .1em; text-shadow: 0 3px 0 #2a2140; }
      @keyframes bootspin { to { transform: rotate(360deg) } }
    </style>
  </head>
  <body>
    <div id="boot"><div class="spin"></div><b>LOADING…</b></div>
    <div id="app"></div>
    <noscript>このゲームを遊ぶにはJavaScriptを有効にしてください。</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
